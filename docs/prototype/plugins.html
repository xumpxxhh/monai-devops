<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>插件 · MONAI DevOps</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="assets/console.css" />
</head>
<body class="bg-canvas text-ink antialiased" data-page="plugins" data-crumb="<span>插件</span> <i class='fa-solid fa-angle-right text-xs mx-1 text-faint'></i> <span class='text-ink'>管理 &amp; 单步试运行</span>">
  <div class="flex min-h-screen">
    <div id="side-nav"></div>
    <div class="flex-1 flex flex-col min-w-0">
      <div id="top-bar"></div>
      <main class="flex-1 p-6 overflow-auto">

        <div class="flex items-center justify-between mb-6">
          <div>
            <h1 class="text-lg font-semibold tracking-tight">插件</h1>
            <p class="text-sm text-muted mt-0.5">已注册插件来自插件注册表。选一个,填 config 单步试运行验证返回。</p>
          </div>
          <span class="text-sm text-muted">共 <span class="text-ink font-mono">7</span> 个已注册</span>
        </div>

        <div class="flex gap-6 items-start">
          <!-- 左:插件列表 -->
          <aside class="w-64 shrink-0 bg-surface border border-line rounded-card overflow-hidden">
            <div class="p-3 border-b border-line">
              <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-faint text-sm"></i>
                <input oninput="filterPlugins(this.value)" placeholder="搜索插件…" class="w-full h-9 pl-9 pr-3 rounded-ctrl bg-raised border border-line text-sm placeholder:text-faint focus:outline-none focus:border-brand" />
              </div>
            </div>
            <div id="plist" class="p-2 space-y-1 max-h-[70vh] overflow-auto"></div>
          </aside>

          <!-- 右:详情 + 单步试运行 -->
          <section class="flex-1 min-w-0 space-y-5">
            <div class="bg-surface border border-line rounded-card p-5">
              <div class="flex items-start gap-3">
                <span id="p-icon" class="grid place-items-center w-11 h-11 rounded-ctrl bg-brand/15 text-brand text-lg"><i class="fa-solid fa-terminal"></i></span>
                <div class="flex-1">
                  <div class="flex items-center gap-2">
                    <h2 id="p-name" class="text-base font-semibold">echo</h2>
                    <span id="p-ver" class="text-xs font-mono text-muted bg-raised px-2 py-0.5 rounded-pill">v1.0.0</span>
                  </div>
                  <p id="p-desc" class="text-sm text-muted mt-1">回显输入(示例插件),用于验证编排与事件链路。</p>
                </div>
                <span class="inline-flex items-center gap-1.5 text-xs text-completed bg-completed/10 px-2.5 py-1 rounded-pill"><i class="fa-solid fa-circle-check"></i> 已注册</span>
              </div>
            </div>

            <!-- 单步试运行 -->
            <div class="bg-surface border border-line rounded-card p-5">
              <div class="flex items-center gap-2 mb-4">
                <i class="fa-solid fa-flask text-brand"></i>
                <h3 class="font-medium">单步试运行</h3>
                <span class="text-xs text-faint">对应内核 executeStep,不影响任何工作流</span>
              </div>

              <label class="block text-xs text-muted mb-1.5">config (JSON)</label>
              <textarea id="cfg" rows="5" oninput="validateJson(this)" class="w-full px-3 py-2.5 rounded-ctrl bg-panel border border-line font-mono text-xs leading-relaxed focus:outline-none focus:border-brand">{
  "value": 1
}</textarea>
              <p id="json-hint" class="text-[11px] text-completed mt-1.5"><i class="fa-solid fa-check"></i> JSON 合法</p>

              <div class="flex items-end gap-3 mt-4">
                <label class="text-sm">
                  <span class="block text-xs text-muted mb-1.5">资源类型</span>
                  <select class="h-9 px-2 rounded-ctrl bg-raised border border-line focus:outline-none focus:border-brand"><option>无</option><option>default</option><option>gpu</option><option>cpu</option></select>
                </label>
                <label class="text-sm">
                  <span class="block text-xs text-muted mb-1.5">演示返回</span>
                  <select id="scenario" class="h-9 px-2 rounded-ctrl bg-raised border border-line focus:outline-none focus:border-brand">
                    <option value="ok">成功</option>
                    <option value="biz">业务失败 (success:false)</option>
                    <option value="404">未注册 (PLUGIN_NOT_FOUND)</option>
                  </select>
                </label>
                <button onclick="runStep()" class="ml-auto h-9 px-4 rounded-ctrl bg-brand text-white text-sm font-medium hover:bg-brand-hover transition-colors"><i class="fa-solid fa-play mr-1.5"></i>试运行此步</button>
              </div>
            </div>

            <!-- 结果 -->
            <div id="result" class="bg-surface border border-line rounded-card p-5">
              <div class="text-xs uppercase tracking-wider text-faint mb-3">结果</div>
              <div id="result-body" class="text-sm text-faint">填入 config 后点「试运行此步」查看 PluginResult 与 plugin:log。</div>
            </div>
          </section>
        </div>

      </main>
    </div>
  </div>

  <script src="assets/app.js"></script>
  <script>
    const PLUGINS = [
      { name: 'echo',   ver: 'v1.0.0', icon: 'fa-terminal',        desc: '回显输入(示例插件),用于验证编排与事件链路。' },
      { name: 'build',  ver: 'v2.1.0', icon: 'fa-hammer',          desc: '编译构建产物,支持缓存与多目标平台。' },
      { name: 'test',   ver: 'v1.3.0', icon: 'fa-vial',            desc: '运行测试套件,可声明 gpu 资源类型。' },
      { name: 'deploy', ver: 'v0.9.0', icon: 'fa-rocket',          desc: '将镜像滚动发布到目标环境。' },
      { name: 'notify', ver: 'v1.0.0', icon: 'fa-bell',            desc: '运行结束发送通知(邮件 / Webhook)。' },
      { name: 'lint',   ver: 'v1.1.0', icon: 'fa-broom',           desc: '静态检查与代码规范审计。' },
      { name: 'docker', ver: 'v3.0.1', icon: 'fa-cubes-stacked',   desc: '构建并推送 Docker 镜像到仓库。' },
    ];
    let sel = 'echo';
    function renderList(list) {
      document.getElementById('plist').innerHTML = list.map((p) => {
        const on = p.name === sel;
        return `<button onclick="selectPlugin('${p.name}')" class="w-full flex items-center gap-2.5 px-2.5 py-2 rounded-ctrl text-left transition-colors ${on ? 'bg-brand-soft' : 'hover:bg-raised'}">
          <span class="grid place-items-center w-7 h-7 rounded-md ${on ? 'bg-brand/25 text-brand' : 'bg-raised text-muted'} text-xs"><i class="fa-solid ${p.icon}"></i></span>
          <div class="min-w-0 flex-1">
            <div class="text-sm font-medium truncate ${on ? 'text-brand' : ''}">${p.name}</div>
            <div class="text-[10px] text-faint font-mono">${p.ver}</div>
          </div>
        </button>`;
      }).join('');
    }
    function filterPlugins(q) { const k = q.trim().toLowerCase(); renderList(PLUGINS.filter((p) => p.name.includes(k))); }
    function selectPlugin(name) {
      sel = name; const p = PLUGINS.find((x) => x.name === name);
      document.getElementById('p-name').textContent = p.name;
      document.getElementById('p-ver').textContent = p.ver;
      document.getElementById('p-desc').textContent = p.desc;
      document.getElementById('p-icon').innerHTML = `<i class="fa-solid ${p.icon}"></i>`;
      renderList(PLUGINS);
    }
    function validateJson(el) {
      const hint = document.getElementById('json-hint');
      try { JSON.parse(el.value); el.classList.remove('border-failed'); hint.className = 'text-[11px] text-completed mt-1.5'; hint.innerHTML = '<i class="fa-solid fa-check"></i> JSON 合法'; return true; }
      catch (e) { el.classList.add('border-failed'); hint.className = 'text-[11px] text-failed mt-1.5'; hint.innerHTML = '<i class="fa-solid fa-xmark"></i> JSON 非法:' + e.message; return false; }
    }
    function runStep() {
      const cfgEl = document.getElementById('cfg');
      if (!validateJson(cfgEl)) { toast('config 不是合法 JSON,已阻止发送', 'err'); return; }
      const scn = document.getElementById('scenario').value;
      const box = document.getElementById('result-body');
      let cfg; try { cfg = JSON.parse(cfgEl.value); } catch (e) { cfg = {}; }
      if (scn === 'ok') {
        box.innerHTML = `
          <div class="inline-flex items-center gap-1.5 text-completed font-medium mb-3"><i class="fa-solid fa-circle-check"></i> success: true</div>
          <pre class="bg-panel border border-line rounded-ctrl p-3 text-xs font-mono text-ink/90 overflow-auto">{
  "success": true,
  "data": { "stepId": "adhoc", "echoed": ${JSON.stringify(cfg)} }
}</pre>
          <div class="mt-3 text-xs font-mono space-y-0.5">
            <div><span class="text-faint">00:00</span> <span class="text-brand">[adhoc]</span> <span class="text-running">log.info</span> 开始执行 type=${sel}</div>
            <div><span class="text-faint">00:00</span> <span class="text-brand">[adhoc]</span> <span class="text-running">log.info</span> 完成,返回 success</div>
          </div>`;
      } else if (scn === 'biz') {
        box.innerHTML = `
          <div class="inline-flex items-center gap-1.5 text-failed font-medium mb-3"><i class="fa-solid fa-circle-xmark"></i> success: false · 业务失败</div>
          <pre class="bg-panel border border-line rounded-ctrl p-3 text-xs font-mono text-ink/90 overflow-auto">{
  "success": false,
  "code": "PLUGIN_EXECUTION_ERROR",
  "message": "invalid value: 期望 number, 实际为 ${typeof cfg.value}"
}</pre>
          <div class="mt-3 text-xs font-mono">
            <div><span class="text-faint">00:00</span> <span class="text-brand">[adhoc]</span> <span class="text-failed">log.error</span> 执行异常,返回 success=false</div>
          </div>`;
      } else {
        box.innerHTML = `
          <div class="inline-flex items-center gap-1.5 text-failed font-medium mb-3"><i class="fa-solid fa-triangle-exclamation"></i> 插件未注册</div>
          <pre class="bg-panel border border-line rounded-ctrl p-3 text-xs font-mono text-ink/90 overflow-auto">{
  "success": false,
  "code": "PLUGIN_NOT_FOUND",
  "message": "插件 '${sel}' 未在注册表中找到"
}</pre>
          <div class="mt-3 text-xs text-muted">提示:这是注册问题而非执行问题,请确认插件已在注册表注册。</div>`;
      }
    }
    renderList(PLUGINS);
  </script>
</body>
</html>
